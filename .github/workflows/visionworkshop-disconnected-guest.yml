name: VisionWorkshop disconnected Windows guest

on:
  push:
    branches: [test/visionworkshop-modular-loader]
    paths:
      - '.github/workflows/visionworkshop-disconnected-guest.yml'
      - 'scripts/verify_vision_train_disconnected.py'
      - 'scripts/verify_vision_train_disconnected.ps1'

permissions:
  contents: read

jobs:
  windows-disconnected-guest:
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scope: [edge, all, activation]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      VW_SCOPE: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - name: Stage exact archived inputs before disconnection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -m scripts.verify_vision_train_disconnected stage "$env:RUNNER_TEMP/vw-disconnected-$env:VW_SCOPE" --scope $env:VW_SCOPE
      - name: Install and update EdgeSAM with the guest disconnected
        if: matrix.scope == 'edge'
        run: ./scripts/verify_vision_train_disconnected.ps1 -Root "$env:RUNNER_TEMP/vw-disconnected-$env:VW_SCOPE" -Scope $env:VW_SCOPE -Phase edge
      - name: Install the original Torch module with the guest disconnected
        if: matrix.scope == 'all'
        run: ./scripts/verify_vision_train_disconnected.ps1 -Root "$env:RUNNER_TEMP/vw-disconnected-$env:VW_SCOPE" -Scope $env:VW_SCOPE -Phase torch
      - name: Save the Torch phase after connectivity is restored
        if: matrix.scope == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-disconnected-torch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vw-disconnected-all/reports/torch
          if-no-files-found: error
          retention-days: 7
      - name: Install the remaining ten original modules with the guest disconnected
        if: matrix.scope == 'all'
        run: ./scripts/verify_vision_train_disconnected.ps1 -Root "$env:RUNNER_TEMP/vw-disconnected-$env:VW_SCOPE" -Scope $env:VW_SCOPE -Phase remaining
      - name: Save the remaining install phase after connectivity is restored
        if: matrix.scope == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-disconnected-remaining-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vw-disconnected-all/reports/remaining
          if-no-files-found: error
          retention-days: 7
      - name: Prepare the independent activation fixture while connected
        if: matrix.scope == 'activation'
        run: python -B -m scripts.verify_vision_train_disconnected prepare-activation "$env:RUNNER_TEMP/vw-disconnected-$env:VW_SCOPE" --scope $env:VW_SCOPE
      - name: Activate the complete original snapshot with the guest disconnected
        if: matrix.scope != 'edge'
        run: ./scripts/verify_vision_train_disconnected.ps1 -Root "$env:RUNNER_TEMP/vw-disconnected-$env:VW_SCOPE" -Scope $env:VW_SCOPE -Phase activate
      - name: Save the activation phase after connectivity is restored
        if: matrix.scope != 'edge'
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-disconnected-activate-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vw-disconnected-${{ matrix.scope }}/reports/activate
          if-no-files-found: error
          retention-days: 7
      - name: Verify the unchanged Core and bind the offline receipts
        if: matrix.scope != 'edge'
        run: python -B -m scripts.verify_vision_train_disconnected finish "$env:RUNNER_TEMP/vw-disconnected-$env:VW_SCOPE" --scope $env:VW_SCOPE
      - name: Upload the network and product evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-disconnected-guest-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vw-disconnected-${{ matrix.scope }}/reports
          if-no-files-found: error
          retention-days: 7
