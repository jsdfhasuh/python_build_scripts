name: VisionWorkshop CPython 3.12 compatibility probe

on:
  push:
    branches:
      - test/visionworkshop-cp312-compat-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cp312:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen
      PYTHONNOUSERSITE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout packager probe
        uses: actions/checkout@v7
        with:
          path: packager
          persist-credentials: false

      - name: Checkout exact application baseline and submodules
        uses: actions/checkout@v7
        with:
          repository: jsdfhasuh/emo-vision-train
          ref: 5b6d45fbd384a108afc320350dcc251f59617094
          path: source
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact CPython 3.12 patch release
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Create isolated probe environment and prepare tooling
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "visionworkshop-cp312-probe"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw "Probe virtual environment creation failed" }
          $probePython = Join-Path $venv "Scripts/python.exe"
          "PROBE_PYTHON=$probePython" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $probePython -c "import sys; assert sys.prefix != sys.base_prefix; print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { throw "Probe environment is not isolated" }
          & $probePython -m pip install --upgrade pip packaging==25.0 pytest==8.3.5
          if ($LASTEXITCODE -ne 0) { throw "Test tooling installation failed" }

      - name: Install matched PyTorch CUDA 12.8 wheels
        shell: pwsh
        run: |
          & $env:PROBE_PYTHON -m pip install --no-deps --index-url https://download.pytorch.org/whl/cu128 torch==2.10.0+cu128 torchvision==0.25.0+cu128 torchaudio==2.10.0+cu128
          if ($LASTEXITCODE -ne 0) { throw "Matched Torch CUDA 12.8 installation failed" }

      - name: Generate unified candidate requirements from application requirements
        shell: pwsh
        run: |
          & $env:PROBE_PYTHON packager/scripts/visionworkshop_cp312_compat_probe.py --source-root source --requirements-out reports/visionworkshop-cp312-candidate.txt
          if ($LASTEXITCODE -ne 0) { throw "Candidate requirements generation failed" }

      - name: Install candidate product dependencies
        shell: pwsh
        run: |
          & $env:PROBE_PYTHON -m pip install --report reports/candidate-install.json -r reports/visionworkshop-cp312-candidate.txt
          if ($LASTEXITCODE -ne 0) { throw "Candidate product dependency resolution/installation failed" }
          & $env:PROBE_PYTHON -m pip install -c reports/visionworkshop-cp312-candidate.txt pyinstaller==6.18.0 pyinstaller-hooks-contrib==2026.0 pefile==2024.8.26
          if ($LASTEXITCODE -ne 0) { throw "Pinned PyInstaller toolchain installation failed" }
          & $env:PROBE_PYTHON -m pip install --force-reinstall --no-deps onnxruntime-gpu==1.23.2 opencv-contrib-python-headless==4.11.0.86
          if ($LASTEXITCODE -ne 0) { throw "Restoring GPU ORT and contrib OpenCV binary owners failed" }

      - name: Verify dependency consistency
        id: consistency
        shell: pwsh
        run: |
          & $env:PROBE_PYTHON -m pip check 2>&1 | Tee-Object reports/pip-check.txt
          if ($LASTEXITCODE -ne 0) { throw "pip check reported dependency conflicts" }

      - name: Run actual CP312 imports and first-party runtime probes
        if: ${{ !cancelled() && steps.consistency.outcome == 'success' }}
        shell: pwsh
        run: |
          & $env:PROBE_PYTHON packager/scripts/visionworkshop_cp312_compat_probe.py --source-root source --report reports/visionworkshop-cp312-runtime-report.json
          if ($LASTEXITCODE -ne 0) { throw "Runtime compatibility probe failed" }

      - name: Run focused first-party regression tests
        if: ${{ !cancelled() && steps.consistency.outcome == 'success' }}
        shell: pwsh
        working-directory: source
        run: |
          & $env:PROBE_PYTHON -m pytest -q tests/test_dinov2_251_core.py tests/test_patchcore_dinov2_features.py tests/test_patchcore_dinov2_loader.py tests/test_patchcore_dinov2_preprocess.py tests/test_dinov2_shared_runtime.py tests/test_patchcore_ckpt_loading.py tests/test_patchcore_backend.py tests/test_kaggle_startup.py tests/test_dino_main_runtime.py tests/test_patchcore_single_file_ckpt.py tests/test_dinov2_onnx.py tests/test_dinov2_deployment_calibration.py tests/test_patchcore_onnx.py tests/test_dinov2_p6.py tests/test_dinov2_progress.py tests/test_patchcore_export_runtime.py tests/test_patchcore_export_ui.py tests/test_update_contract.py tests/test_update_file_transaction.py tests/test_update_v3_runtime.py --junitxml=../reports/visionworkshop-cp312-focused-tests.xml
          if ($LASTEXITCODE -ne 0) { throw "Focused first-party regression tests failed" }

      - name: Record installed environment even after probe failures
        if: ${{ !cancelled() && env.PROBE_PYTHON != '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          & $env:PROBE_PYTHON -m pip list --format=json | Out-File reports/installed-packages.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Installed package list collection failed" }
          & $env:PROBE_PYTHON -m pip freeze --all | Out-File reports/installed-freeze.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Installed freeze collection failed" }
          & $env:PROBE_PYTHON -m pip inspect | Out-File reports/pip-inspect.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Installed environment evidence collection failed" }

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-cp312-compat-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn

