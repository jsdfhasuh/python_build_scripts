name: VisionWorkshop CPython 3.12 compatibility probe

on:
  push:
    branches:
      - test/visionworkshop-cp312-compat-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cp312:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen
      PYTHONNOUSERSITE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout packager probe
        uses: actions/checkout@v7
        with:
          path: packager
          persist-credentials: false

      - name: Checkout exact application baseline and submodules
        uses: actions/checkout@v7
        with:
          repository: jsdfhasuh/emo-vision-train
          ref: bb3772003f0b8cbd872d9342a48aa4a82d5bb861
          path: source
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact production packager revision
        uses: actions/checkout@v7
        with:
          repository: jsdfhasuh/python_build_scripts
          ref: f8ba210d876220f49c4a1d33fb1e85366e36ccad
          path: packager-main
          persist-credentials: false

      - name: Set up exact CPython 3.12 patch release
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            source/requirements.txt
            packager-main/ci/vision-train-runtime.json

      - name: Create isolated production build environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          $venv = Join-Path $env:RUNNER_TEMP 'visionworkshop-cp312-build'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Build virtual environment creation failed' }
          $buildPython = Join-Path $venv 'Scripts/python.exe'
          & $buildPython -c "import sys; assert sys.prefix != sys.base_prefix; print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { throw 'Build environment is not isolated' }
          "BUILD_PYTHON=$buildPython" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $buildPython -m pip install Pillow packaging==25.0 PyYAML
          if ($LASTEXITCODE -ne 0) { throw 'Build preflight tooling installation failed' }

      - name: Validate production packager before heavy dependencies
        shell: pwsh
        working-directory: packager-main
        run: |
          $modules = (Get-ChildItem -Path . -Filter '*.py' -File).FullName
          & $env:BUILD_PYTHON -X "pycache_prefix=$env:RUNNER_TEMP/visionworkshop-cp312-syntax" -m py_compile @modules
          if ($LASTEXITCODE -ne 0) { throw 'Production packager syntax validation failed' }
          & $env:BUILD_PYTHON -m unittest discover -s tests -v 2>&1 | Tee-Object ../reports/packager-unit-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Production packager unit tests failed' }

      - name: Prepare non-publishing portable build
        shell: pwsh
        working-directory: packager-main
        env:
          RELEASE_INPUTS_JSON: '{"source_ref":"bb3772003f0b8cbd872d9342a48aa4a82d5bb861","release_tag":"","branding_profile":"profiles/visionworkshop.json","publish_release":false,"release_repo":"jsdfhasuh/emo-vision-train-release","delta_base_tag":"none","mandatory":false,"changelog_all":true}'
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO_TOKEN: ''
        run: |
          & $env:BUILD_PYTHON -X utf8 actions_release.py prepare `
            --source-root (Join-Path $env:GITHUB_WORKSPACE 'source') `
            --state (Join-Path $env:RUNNER_TEMP 'vision-train-release-cp312') `
            --output (Join-Path $env:GITHUB_WORKSPACE 'packager-main/release-output/cp312-probe') `
            2>&1 | Tee-Object ../reports/portable-preflight.log
          if ($LASTEXITCODE -ne 0) { throw 'Portable build preflight failed' }

      - name: Install exact production CP312 runtime
        shell: pwsh
        working-directory: packager-main
        run: |
          & $env:BUILD_PYTHON -X utf8 vision_train_runtime.py install --source-root ../source 2>&1 | Tee-Object ../reports/production-runtime-install.log
          if ($LASTEXITCODE -ne 0) { throw 'Production CP312 runtime installation failed' }

      - name: Verify production dependency consistency
        id: consistency
        shell: pwsh
        run: |
          & $env:BUILD_PYTHON -m pip check 2>&1 | Tee-Object reports/pip-check.txt
          if ($LASTEXITCODE -ne 0) { throw 'Production pip check reported dependency conflicts' }
          & $env:BUILD_PYTHON -m pip freeze --all | Out-File reports/production-freeze.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Production environment snapshot failed' }
          & $env:BUILD_PYTHON -m pip inspect | Out-File reports/production-pip-inspect.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Production dependency metadata collection failed' }

      - name: Run actual CP312 imports and first-party runtime probes
        id: runtime_probe
        shell: pwsh
        run: |
          & $env:BUILD_PYTHON packager/scripts/visionworkshop_cp312_compat_probe.py --source-root source --report reports/visionworkshop-cp312-runtime-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Production runtime compatibility probe failed' }

      - name: Install application regression tooling
        shell: pwsh
        run: |
          & $env:BUILD_PYTHON -m pip install pytest==8.3.5
          if ($LASTEXITCODE -ne 0) { throw 'Application regression tooling installation failed' }
          & $env:BUILD_PYTHON -m pip check 2>&1 | Tee-Object reports/pip-check-with-test-tools.txt
          if ($LASTEXITCODE -ne 0) { throw 'Test tooling introduced dependency conflicts' }

      - name: Run focused first-party regression tests
        id: focused_tests
        shell: pwsh
        working-directory: source
        run: |
          & $env:BUILD_PYTHON -m pytest -q tests/test_dinov2_251_core.py tests/test_patchcore_dinov2_features.py tests/test_patchcore_dinov2_loader.py tests/test_patchcore_dinov2_preprocess.py tests/test_dinov2_shared_runtime.py tests/test_patchcore_ckpt_loading.py tests/test_patchcore_backend.py tests/test_kaggle_startup.py tests/test_dino_main_runtime.py tests/test_patchcore_single_file_ckpt.py tests/test_dinov2_onnx.py tests/test_dinov2_deployment_calibration.py tests/test_patchcore_onnx.py tests/test_dinov2_p6.py tests/test_dinov2_progress.py tests/test_patchcore_export_runtime.py tests/test_patchcore_export_ui.py tests/test_update_contract.py tests/test_update_file_transaction.py tests/test_update_v3_runtime.py --junitxml=../reports/visionworkshop-cp312-focused-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Focused first-party regression tests failed' }

      - name: Build frozen VisionWorkshop without publishing
        shell: pwsh
        working-directory: packager-main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO_TOKEN: ''
        run: |
          & $env:BUILD_PYTHON -X utf8 actions_release.py build --state (Join-Path $env:RUNNER_TEMP 'vision-train-release-cp312') 2>&1 | Tee-Object ../reports/portable-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Frozen CP312 package build failed' }

      - name: Verify and stage non-public package assets
        id: stage_package
        shell: pwsh
        working-directory: packager-main
        run: |
          & $env:BUILD_PYTHON -X utf8 actions_release.py stage `
            --state (Join-Path $env:RUNNER_TEMP 'vision-train-release-cp312') `
            --destination (Join-Path $env:RUNNER_TEMP 'vision-train-public-cp312')
          if ($LASTEXITCODE -ne 0) { throw 'CP312 package staging failed' }
          Get-ChildItem (Join-Path $env:RUNNER_TEMP 'vision-train-public-cp312') -File |
            Select-Object Name,Length | Format-Table -AutoSize
          $bytes = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'vision-train-public-cp312') -File |
            Measure-Object -Property Length -Sum).Sum
          "STAGED_ASSET_BYTES=$bytes" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Exercise real frozen package in a disposable installation
        id: frozen_smoke
        shell: pwsh
        working-directory: packager-main
        run: |
          $archives = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'vision-train-public-cp312') -Filter '*-full.zip' -File)
          if ($archives.Count -ne 1) { throw 'Expected exactly one staged full package' }
          & $env:BUILD_PYTHON -X utf8 scripts/verify_vision_train_frozen.py `
            --zip $archives[0].FullName `
            --source-root (Join-Path $env:GITHUB_WORKSPACE 'source') `
            --output (Join-Path $env:GITHUB_WORKSPACE 'reports/frozen-smoke')
          if ($LASTEXITCODE -ne 0) { throw 'Real frozen package smoke failed; see separate evidence' }

      - name: Upload non-publishing CP312 package artifact
        if: ${{ !cancelled() && steps.stage_package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-cp312-portable-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vision-train-public-cp312/
          if-no-files-found: error
          compression-level: 0

      - name: Record build environment even after failures
        if: ${{ !cancelled() && env.BUILD_PYTHON != '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          & $env:BUILD_PYTHON -m pip list --format=json | Out-File reports/installed-packages.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Installed package list collection failed' }
          & $env:BUILD_PYTHON -m pip freeze --all | Out-File reports/installed-freeze.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Installed freeze collection failed' }
          & $env:BUILD_PYTHON -m pip inspect | Out-File reports/pip-inspect.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Build environment evidence collection failed' }

      - name: Collect diagnostic build records
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          $summary = Join-Path $env:GITHUB_WORKSPACE 'packager-main/release-output/cp312-probe/build-summary.json'
          if (Test-Path $summary) { Copy-Item $summary reports/build-summary.json }
          $request = Join-Path $env:RUNNER_TEMP 'vision-train-release-cp312/request.json'
          if (Test-Path $request) { Copy-Item $request reports/build-request.json }
          $records = Join-Path $env:GITHUB_WORKSPACE 'packager-main/build/branding/emo-vision-train'
          if (Test-Path $records) {
            foreach ($build in (Get-ChildItem $records -Directory)) {
              $destination = Join-Path 'reports/build-records' $build.Name
              New-Item -ItemType Directory -Force $destination | Out-Null
              foreach ($name in @('build-record.json', 'build-result.json', 'effective-config.json', 'input-snapshot-before.json', 'input-changes.json')) {
                $record = Join-Path $build.FullName $name
                if (Test-Path $record) { Copy-Item $record (Join-Path $destination $name) }
              }
            }
          }

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-cp312-compat-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
