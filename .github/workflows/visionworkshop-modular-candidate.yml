name: VisionWorkshop protocol-4 modular candidate

on:
  push:
    branches:
      - test/visionworkshop-modular-loader
    paths:
      - 'ci/visionworkshop-modular-candidate.json'
      - '.github/workflows/visionworkshop-modular-candidate.yml'
  workflow_dispatch:
    inputs:
      app_ref:
        description: Exact application commit containing the shared protocol-4 contract and checks
        type: string
        required: true
      reuse_run_id:
        description: Optional completed candidate run whose exact module ZIPs will be fully reverified
        type: string
        required: false
        default: ''
      reuse_run_attempt:
        description: Exact attempt of the optional reusable source run
        type: string
        required: false
        default: '1'
      guarded_core:
        description: Build a protocol-4 Core with the native pre-Python startup guard
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  windows-modular-candidate:
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout modular builder
        uses: actions/checkout@v7
        with:
          path: packager
          persist-credentials: false

      - name: Validate exact application source input
        shell: pwsh
        env:
          CANDIDATE_EVENT: ${{ github.event_name }}
          APP_SOURCE_INPUT: ${{ inputs.app_ref }}
          REUSE_RUN_INPUT: ${{ inputs.reuse_run_id }}
          REUSE_ATTEMPT_INPUT: ${{ inputs.reuse_run_attempt }}
          GUARDED_CORE_INPUT: ${{ inputs.guarded_core }}
        run: |
          $guardedCore = $false
          if ($env:CANDIDATE_EVENT -eq 'push') {
            $candidate = Get-Content packager/ci/visionworkshop-modular-candidate.json -Raw | ConvertFrom-Json
            $fields = ($candidate.PSObject.Properties.Name | Sort-Object) -join ','
            if ($fields -notin @('app_ref,reuse_run_attempt,reuse_run_id','app_ref,guarded_core,reuse_run_attempt,reuse_run_id')) {
              throw 'The explicit candidate request contains unexpected input fields'
            }
            foreach ($field in @('app_ref', 'reuse_run_id', 'reuse_run_attempt')) {
              if ($candidate.$field -isnot [string]) { throw 'Candidate request fields must be strings' }
            }
            $env:APP_SOURCE_REF = $candidate.app_ref
            $env:REUSE_RUN_ID = $candidate.reuse_run_id
            $env:REUSE_RUN_ATTEMPT = $candidate.reuse_run_attempt
            if ($candidate.PSObject.Properties['guarded_core']) {
              if ($candidate.guarded_core -isnot [bool]) { throw 'guarded_core must be a Boolean' }
              $guardedCore = $candidate.guarded_core
            }
          } elseif ($env:CANDIDATE_EVENT -eq 'workflow_dispatch') {
            $env:APP_SOURCE_REF = $env:APP_SOURCE_INPUT
            $env:REUSE_RUN_ID = $env:REUSE_RUN_INPUT
            $env:REUSE_RUN_ATTEMPT = $env:REUSE_ATTEMPT_INPUT
            $guardedCore = $env:GUARDED_CORE_INPUT -eq 'true'
          } else {
            throw 'Only explicit candidate requests or workflow dispatch may start this build'
          }
          if ($env:APP_SOURCE_REF -notmatch '^[a-f0-9]{40}$') {
            throw 'An exact reviewed application commit is required before this candidate can build'
          }
          if (($env:REUSE_RUN_ID -and $env:REUSE_RUN_ID -notmatch '^[1-9][0-9]*$') -or $env:REUSE_RUN_ATTEMPT -notmatch '^[1-9][0-9]*$') {
            throw 'Optional reuse requires positive exact run and attempt numbers'
          }
          if ($guardedCore -and -not $env:REUSE_RUN_ID) { throw 'A guarded Core candidate requires verified original module ZIPs' }
          "GUARDED_CORE=$($guardedCore.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_SOURCE_REF=$env:APP_SOURCE_REF" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "REUSE_RUN_ID=$env:REUSE_RUN_ID" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "REUSE_RUN_ATTEMPT=$env:REUSE_RUN_ATTEMPT" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout exact application and its fixed vendors
        uses: actions/checkout@v7
        with:
          repository: jsdfhasuh/emo-vision-train
          ref: ${{ env.APP_SOURCE_REF }}
          path: source
          submodules: recursive
          lfs: true
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up exact CPython
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'

      - name: Locate download cache
        id: pip-cache-path
        shell: pwsh
        run: |
          $pipCachePath = python -m pip cache dir
          if ($LASTEXITCODE -ne 0) { throw 'Cannot locate pip cache' }
          "directory=$pipCachePath" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore pinned preparation downloads
        id: module-pip-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pip-cache-path.outputs.directory }}
          key: vw-p4-pip-${{ runner.os }}-cp31210-${{ hashFiles('packager/ci/visionworkshop-modular.json', 'packager/ci/vision-train-modular-probe-constraints.txt') }}
          restore-keys: |
            vw-p4-pip-${{ runner.os }}-cp31210-
            vw-b2-pip-${{ runner.os }}-cp31210-

      - name: Create separate compiler and dependency preparation environments
        shell: pwsh
        run: |
          python -c "import sys; assert sys.version_info[:3] == (3,12,10)"
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected Python version' }
          New-Item -ItemType Directory -Force reports | Out-Null
          $compilerVenv = Join-Path $env:RUNNER_TEMP 'vw-p4-compiler'
          $runtimeVenv = Join-Path $env:RUNNER_TEMP 'vw-p4-dependencies'
          python -m venv $compilerVenv
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create compiler environment' }
          python -m venv $runtimeVenv
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create dependency environment' }
          "BUILD_PYTHON=$compilerVenv/Scripts/python.exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RUNTIME_PYTHON=$runtimeVenv/Scripts/python.exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install compiler and test tools only
        shell: pwsh
        run: |
          & $env:BUILD_PYTHON -m pip install pyinstaller==6.18.0 pyinstaller-hooks-contrib==2026.0 `
            Pillow==12.0.0 PyYAML==6.0.3 pytest==8.4.2 requests==2.32.5 numpy==2.0.2 pefile==2024.8.26 `
            --report reports/compiler-install.json
          if ($LASTEXITCODE -ne 0) { throw 'Compiler/test installation failed' }
          & $env:BUILD_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Compiler/test dependencies conflict' }

      - name: Verify builder and native Windows transaction contracts
        shell: pwsh
        run: |
          $env:VISIONWORKSHOP_MODULE_SOURCE = Join-Path $env:GITHUB_WORKSPACE 'source'
          Push-Location packager
          & $env:BUILD_PYTHON -m unittest discover -s tests -p test_vision_train_candidate_reports.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Read-only candidate log projection guards failed' }
          & $env:BUILD_PYTHON -m unittest discover -s tests -p test_vision_train_modular_build.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Modular builder unit checks failed' }
          & $env:BUILD_PYTHON -m unittest discover -s tests -p test_vision_train_modular_reuse.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Exact module ZIP reuse checks failed' }
          & $env:BUILD_PYTHON -m unittest discover -s tests -p test_vision_train_modular_receipts.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Immutable source-module receipt qualification failed' }
          & $env:BUILD_PYTHON -m unittest discover -s tests -p test_windows_qt_fonts.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native Qt font probe guards failed' }
          & $env:BUILD_PYTHON -m unittest discover -s tests -p test_vision_train_modular_index.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Module index binding checks failed' }
          Pop-Location
          Push-Location source
          & $env:BUILD_PYTHON -m unittest discover -s tests -p test_module_contract.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Application module contract checks failed' }
          & $env:BUILD_PYTHON -m unittest discover -s tests -p test_module_runtime.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows offline ZIP/transaction/lease checks failed' }
          if ($env:GUARDED_CORE -eq 'true') {
            & $env:BUILD_PYTHON -m pytest -p no:cacheprovider tests/test_core_update.py tests/test_core_update_transaction.py `
              -q --junitxml ../reports/core-upgrade-source.xml
            if ($LASTEXITCODE -ne 0) { throw 'Offline Core upgrade preparation and recovery checks failed' }
          }
          & $env:BUILD_PYTHON -m pytest -p no:cacheprovider tests/test_module_repair.py `
            tests/test_module_runtime_check_annotation.py tests/test_offline_fonts.py `
            tests/test_module_runtime_check_resources.py `
            tests/test_module_runtime_check_dino.py `
            tests/test_module_runtime_check_security.py tests/test_module_runtime_check_native.py `
            tests/test_module_runtime_check_spawn.py `
            -q --junitxml ../reports/module-repair-annotation-source.xml
          if ($LASTEXITCODE -ne 0) { throw 'Repair and annotation guard checks failed or did not collect tests' }
          & $env:BUILD_PYTHON -m pytest -p no:cacheprovider tests/test_cnn_onnx_entry.py::test_export_worker_requires_actual_run_permission -q
          if ($LASTEXITCODE -ne 0) { throw 'Protocol-3 fixed worker authorization checks failed' }
          Pop-Location

      - name: Prepare explicit modular dependency recipe
        shell: pwsh
        run: |
          & $env:BUILD_PYTHON packager/scripts/build_vision_train_modular.py prepare --output modular-input
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare selected dependency recipe' }

      - name: Install the selected fixed dependency closures
        shell: pwsh
        run: |
          & $env:RUNTIME_PYTHON -m pip install -c modular-input/constraints.txt -r modular-input/requirements.txt `
            --extra-index-url https://download.pytorch.org/whl/cu128 --report reports/runtime-install.json
          if ($LASTEXITCODE -ne 0) { throw 'Selected runtime dependency installation failed' }
          & $env:RUNTIME_PYTHON -m pip install --force-reinstall --no-deps `
            onnxruntime-gpu==1.23.2 opencv-contrib-python-headless==4.11.0.86 `
            --report reports/provider-install.json
          if ($LASTEXITCODE -ne 0) { throw 'Explicit namespace provider installation failed' }
          & $env:RUNTIME_PYTHON -m pip check 2>&1 | Tee-Object reports/preparation-pip-check.txt
          if ($LASTEXITCODE -ne 0) { throw 'Prepared distributions conflict before adding the source-only vendor' }
          & $env:RUNTIME_PYTHON -m pip inspect | Out-File reports/runtime-inspect.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect the actual preparation environment' }
          & $env:RUNTIME_PYTHON -m pip freeze --all | Out-File reports/runtime-freeze.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record the actual preparation environment' }

      - name: Observe native Windows Qt font rendering before construction
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          & $env:BUILD_PYTHON packager/scripts/verify_windows_qt_fonts.py `
            --runtime-python $env:RUNTIME_PYTHON --output reports/qt-font-probe
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows Qt text rendering failed' }

      - name: Prepare the fixed official Microsoft CRT without running its installer
        shell: pwsh
        run: |
          & $env:BUILD_PYTHON packager/scripts/build_vision_train_modular.py crt `
            --source-root source --output modular-crt
          if ($LASTEXITCODE -ne 0) { throw 'Fixed official CRT download or pure CAB extraction failed' }

      - name: Save successful downloads before construction
        if: ${{ steps.module-pip-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.pip-cache-path.outputs.directory }}
          key: ${{ steps.module-pip-cache.outputs.cache-primary-key }}

      - name: Prepare the independently verified offline model resources
        shell: pwsh
        run: |
          & $env:BUILD_PYTHON packager/scripts/build_vision_train_modular.py assets `
            --source-root source --assets-root modular-assets --output reports/resource-preparation.json
          if ($LASTEXITCODE -ne 0) { throw 'Offline model resource preparation failed' }

      - name: Verify the real prepared font through the vendor cache aliases
        shell: pwsh
        run: |
          $env:VISIONWORKSHOP_TEST_FONT_DIR = Join-Path $env:GITHUB_WORKSPACE 'modular-assets/static/fonts'
          Push-Location source
          & $env:BUILD_PYTHON -m pytest -p no:cacheprovider `
            tests/test_offline_fonts.py::test_supplied_official_otf_loads_unchanged_through_both_vendor_aliases `
            -q --junitxml ../reports/offline-fonts-native.xml
          if ($LASTEXITCODE -ne 0) { throw 'The official font did not load through its exact vendor cache aliases' }
          & $env:BUILD_PYTHON -c "import xml.etree.ElementTree as E; r=E.parse('../reports/offline-fonts-native.xml').getroot(); assert len(r.findall('.//testcase')) == 1 and not any(r.findall('.//' + name) for name in ('skipped','failure','error'))"
          if ($LASTEXITCODE -ne 0) { throw 'The real official font check did not execute successfully' }
          Pop-Location
          Remove-Item Env:VISIONWORKSHOP_TEST_FONT_DIR

      - name: Download and bind optional completed-run module artifacts
        if: ${{ env.REUSE_RUN_ID != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & $env:BUILD_PYTHON packager/scripts/prepare_vision_train_module_reuse.py `
            --run-id $env:REUSE_RUN_ID --attempt $env:REUSE_RUN_ATTEMPT --output modular-reuse
          if ($LASTEXITCODE -ne 0) { throw 'Completed source artifacts failed provenance or byte verification' }

      - name: Construct real Core and independent module ZIPs
        id: build-candidate
        shell: pwsh
        run: |
          $reuseArgs = @()
          if ($env:REUSE_RUN_ID) { $reuseArgs = @('--reuse-root', 'modular-reuse') }
          $guardArgs = @()
          if ($env:GUARDED_CORE -eq 'true') {
            $archive = Join-Path $env:RUNNER_TEMP 'pyinstaller-6.18.0.tar.gz'
            $bootloader = Join-Path $env:RUNNER_TEMP 'visionworkshop-core-bootloader'
            Invoke-WebRequest 'https://files.pythonhosted.org/packages/9f/b8/0fe3359920b0a4e7008e0e93ff383003763e3eee3eb31a07c52868722960/pyinstaller-6.18.0.tar.gz' -OutFile $archive
            & $env:BUILD_PYTHON -I -B packager/scripts/build_vision_train_core_bootloader.py `
              --source-archive $archive --output $bootloader
            if ($LASTEXITCODE -ne 0) { throw 'Pinned guarded bootloader compilation failed' }
            $receipt = Join-Path $bootloader 'bootloader-build.json'
            Copy-Item -LiteralPath $receipt -Destination reports/core-admission-toolchain.json
            Copy-Item -LiteralPath (Join-Path $bootloader 'waf-build.log') -Destination reports/core-admission-waf.log
            Copy-Item -LiteralPath (Join-Path $bootloader 'upgrade-launcher-build.log') -Destination reports/core-upgrade-launcher-build.log
            $toolchain = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
            $guardArgs = @('--core-admission-bootloader', (Join-Path $bootloader 'runw.exe'), $toolchain.bootloader_sha256,
                           '--core-upgrade-launcher', (Join-Path $bootloader 'VisionWorkshopLauncher.exe'), $toolchain.upgrade_launcher_sha256)
          }
          & $env:BUILD_PYTHON packager/scripts/build_vision_train_modular.py build `
            --source-root source --assets-root modular-assets --output modular-candidate `
            --build-python $env:BUILD_PYTHON --runtime-python $env:RUNTIME_PYTHON `
            --install-report reports/runtime-install.json --install-report reports/provider-install.json `
            --torch-install-report reports/runtime-install.json --crt-root modular-crt `
            --build-id "candidate-${{ github.run_id }}-${{ github.run_attempt }}" `
            @reuseArgs @guardArgs `
            2>&1 | Tee-Object reports/modular-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Modular candidate construction failed' }

      - name: Exercise actual product EXE and offline module lifecycle
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          & $env:BUILD_PYTHON packager/scripts/verify_vision_train_modular_product.py `
            --build-summary modular-candidate/reports/modular-build-summary.json `
            --output modular-acceptance --pt-timeout 1800 `
            2>&1 | Tee-Object reports/modular-acceptance.log
          if ($LASTEXITCODE -ne 0) { throw 'Real modular product acceptance failed' }

      - name: Print bounded hash-bound candidate report projections
        if: always()
        shell: pwsh
        run: |
          python -I -S -B packager/scripts/report_vision_train_modular_candidate.py --build modular-candidate/reports --product modular-acceptance/reports
          if ($LASTEXITCODE -ne 0) { throw 'Candidate log projection failed; full reports remain in the artifact' }

      - name: Upload candidate evidence independently
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-modular-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/**
            modular-input/**
            modular-reuse/*.json
            modular-crt/reports/**
            modular-candidate/reports/**
            modular-acceptance/reports/**
            modular-acceptance/isolated-user/AppData/Local/VisionWorkshop/logs/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload the independent module index
        if: ${{ !cancelled() && steps.build-candidate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-module-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: modular-candidate/archives/module-index.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload Core candidate independently
        if: ${{ !cancelled() && steps.build-candidate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-core-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: modular-candidate/archives/VisionWorkshop-Core-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload runtime.torch offline candidate
        if: ${{ !cancelled() && steps.build-candidate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-module-runtime.torch-${{ github.run_id }}-${{ github.run_attempt }}
          path: modular-candidate/archives/runtime.torch-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload runtime.ort offline candidate
        if: ${{ !cancelled() && steps.build-candidate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-module-runtime.ort-${{ github.run_id }}-${{ github.run_attempt }}
          path: modular-candidate/archives/runtime.ort-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload runtime.science offline candidate
        if: ${{ !cancelled() && steps.build-candidate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-module-runtime.science-${{ github.run_id }}-${{ github.run_attempt }}
          path: modular-candidate/archives/runtime.science-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload runtime.vision offline candidate
        if: ${{ !cancelled() && steps.build-candidate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-module-runtime.vision-${{ github.run_id }}-${{ github.run_attempt }}
          path: modular-candidate/archives/runtime.vision-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload feature.yolo offline candidate
        if: ${{ !cancelled() && steps.build-candidate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-module-feature.yolo-${{ github.run_id }}-${{ github.run_attempt }}
          path: modular-candidate/archives/feature.yolo-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload feature.patchcore offline candidate
        if: ${{ !cancelled() && steps.build-candidate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-module-feature.patchcore-${{ github.run_id }}-${{ github.run_attempt }}
          path: modular-candidate/archives/feature.patchcore-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload resource.yolo offline candidate
        if: ${{ !cancelled() && steps.build-candidate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-module-resource.yolo-${{ github.run_id }}-${{ github.run_attempt }}
          path: modular-candidate/archives/resource.yolo-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload resource.patchcore-cnn offline candidate
        if: ${{ !cancelled() && steps.build-candidate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-module-resource.patchcore-cnn-${{ github.run_id }}-${{ github.run_attempt }}
          path: modular-candidate/archives/resource.patchcore-cnn-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload resource.image-simplification offline candidate
        if: ${{ !cancelled() && steps.build-candidate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-module-resource.image-simplification-${{ github.run_id }}-${{ github.run_attempt }}
          path: modular-candidate/archives/resource.image-simplification-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload resource.edgesam offline candidate
        if: ${{ !cancelled() && steps.build-candidate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-module-resource.edgesam-${{ github.run_id }}-${{ github.run_attempt }}
          path: modular-candidate/archives/resource.edgesam-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload resource.patchcore-dino offline candidate
        if: ${{ !cancelled() && steps.build-candidate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: visionworkshop-module-resource.patchcore-dino-${{ github.run_id }}-${{ github.run_attempt }}
          path: modular-candidate/archives/resource.patchcore-dino-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Record candidate scope
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          'Protocol 4 candidate only. No Release was created or published.' | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          'CPU fixtures, actual GPU execution, pinned vendor metadata compatibility, and business-model acceptance are distinct.' | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          'The pinned Ultralytics source still declares torch<2.10; its full compatibility declaration remains a release gate.' | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
